services:
  postgres:
    image: postgres:15-alpine
    container_name: lifeos-postgres
    networks:
      - lifeos-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lifeos-redis
    command: redis-server --appendonly yes
    networks:
      - lifeos-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lucasmks/life-os-ref:backend
    container_name: lifeos-backend
    networks:
      - lifeos-network
      - proxy-network
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=lifeos-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-lifeos_db}
      - POSTGRES_USER=${POSTGRES_USER:-lifeos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lifeos_password}
      - REDIS_HOST=lifeos-redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SITE_URL=${SITE_URL:-http://localhost:5173}
      - BOT_USER_ID=${BOT_USER_ID}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - PANDASCORE_API_KEY=${PANDASCORE_API_KEY}
      - LMSFAVORITE_URL=${LMSFAVORITE_URL:-http://lmsfavorite:8083}
      - LMSRATING_URL=${LMSRATING_URL:-http://lmsrating:8082}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,https://lifeos.lucasmks.com.br}
      - JAVA_TOOL_OPTIONS=-Xmx512m
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lucasmks/life-os-ref:frontend
    container_name: lifeos-frontend
    networks:
      - lifeos-network
      - proxy-network
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 50M
    restart: unless-stopped

networks:
  lifeos-network:
    driver: bridge
  proxy-network:
    external: true

volumes:
  postgres_data:
    name: lifeos_ref_postgres_data
  redis_data:
    name: lifeos_ref_redis_data
  uploads_data:
    name: lifeos_ref_uploads_data
